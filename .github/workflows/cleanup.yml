name: Cleanup Old Releases

on:
  schedule:
    # Every Sunday at 6:00 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  cleanup-releases:
    name: Delete Releases Older Than 1 Day
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete old releases and tags
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 1 * 24 * 60 * 60 * 1000;

            // Paginate through all releases
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            const old = releases.filter(r => new Date(r.created_at).getTime() < cutoff);

            if (old.length === 0) {
              console.log('No releases older than 1 day.');
              return;
            }

            console.log(`Found ${old.length} release(s) to delete.`);

            for (const release of old) {
              console.log(`Deleting release "${release.name || release.tag_name}" (created ${release.created_at})`);

              // Delete the release
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });

              // Delete the associated tag
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
                console.log(`  Deleted tag ${release.tag_name}`);
              } catch (e) {
                console.log(`  Tag ${release.tag_name} already deleted or not found.`);
              }
            }

            console.log('Cleanup complete.');

  cleanup-specs:
    name: Remove Accumulated Podspec Versions
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Remove old Specs versions
        run: |
          if [ -d "Specs/RollaSDK" ] && [ "$(ls -A Specs/RollaSDK 2>/dev/null)" ]; then
            echo "Found Specs/RollaSDK versions:"
            ls Specs/RollaSDK/
            rm -rf Specs/RollaSDK/*/
            echo "All version folders removed."
          else
            echo "No Specs/RollaSDK versions to clean."
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Cleanup: remove accumulated Specs versions"
            git push origin dev
            echo "Pushed cleanup commit."
          else
            echo "Nothing to clean up."
          fi
