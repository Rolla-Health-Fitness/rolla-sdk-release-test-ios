name: Cleanup Old Releases

on:
  schedule:
    # Every Sunday at 6:00 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  cleanup:
    name: Delete Releases Older Than 7 Days
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete old releases and tags
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;

            // Paginate through all releases
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            const old = releases.filter(r => new Date(r.created_at).getTime() < cutoff);

            if (old.length === 0) {
              console.log('No releases older than 7 days.');
              return;
            }

            console.log(`Found ${old.length} release(s) to delete.`);

            for (const release of old) {
              console.log(`Deleting release "${release.name || release.tag_name}" (created ${release.created_at})`);

              // Delete the release
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });

              // Delete the associated tag
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
                console.log(`  Deleted tag ${release.tag_name}`);
              } catch (e) {
                console.log(`  Tag ${release.tag_name} already deleted or not found.`);
              }
            }

            console.log('Cleanup complete.');
